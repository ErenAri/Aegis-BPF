name: Falco Responder

on:
  push:
    branches: [main]
    paths:
      - 'integrations/falco/aegis-responder/**'
      - '.github/workflows/falco-responder.yml'
  pull_request:
    paths:
      - 'integrations/falco/aegis-responder/**'
      - '.github/workflows/falco-responder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/falco/aegis-responder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: CGO_ENABLED=0 go build ./...
