version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Signing-path actions in release.yml (tag-triggered + gated on the offline
      # self-hosted runners) can't be exercised in push CI, so their untested
      # major bumps are held until they can be validated in a real release run.
      # Remove an entry to let Dependabot propose the next major again.
      - dependency-name: "sigstore/cosign-installer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/attest-build-provenance"
        update-types: ["version-update:semver-major"]
